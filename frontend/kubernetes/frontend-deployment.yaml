---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: black-veil-frontend
  namespace: black-veil
  labels:
    app: black-veil
    component: frontend
    managed-by: blackbox-ai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: black-veil
      component: frontend
  template:
    metadata:
      labels:
        app: black-veil
        component: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: frontend
        image: black-veil/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_API_BASE_URL
          value: "https://api.black-veil.io/api/v1"
        - name: VITE_WS_URL
          value: "wss://api.black-veil.io"
        - name: VITE_ENVIRONMENT
          value: "production"
        - name: VITE_APP_VERSION
          value: "5.0.0"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: black-veil-frontend
  namespace: black-veil
  labels:
    app: black-veil
    component: frontend
spec:
  selector:
    app: black-veil
    component: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: black-veil-frontend-external
  namespace: black-veil
  labels:
    app: black-veil
    component: frontend
spec:
  selector:
    app: black-veil
    component: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
    protocol: TCP
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: black-veil-frontend-hpa
  namespace: black-veil
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: black-veil-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: black-veil-frontend-ingress
  namespace: black-veil
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - dashboard.black-veil.io
    secretName: black-veil-tls
  rules:
  - host: dashboard.black-veil.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: black-veil-frontend
            port:
              number: 80

