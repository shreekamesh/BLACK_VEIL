<!DOCTYPE html>
<html>
<head>
    <title>BLACK VEIL - Live Dashboard</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a12;
            color: #e0e0e0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #111122;
            border-radius: 10px;
            border: 1px solid #1a1a2e;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 24px; background: linear-gradient(135deg, #00ff88, #00ccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .time { color: #666; font-family: monospace; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #111122;
            border: 1px solid #1a1a2e;
            border-radius: 10px;
            padding: 15px 20px;
            text-align: center;
        }
        .stat-card .value { font-size: 28px; font-weight: 700; color: #00ff88; }
        .stat-card .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px; }
        .flow-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            background: #0a0a15;
            border-radius: 10px;
            border: 1px solid #1a1a2e;
            flex-wrap: wrap;
            margin-bottom: 20px;
            min-height: 80px;
        }
        .flow-node {
            background: #151530;
            border: 1px solid #2a2a5a;
            border-radius: 8px;
            padding: 8px 14px;
            text-align: center;
            min-width: 70px;
            transition: all 0.5s;
        }
        .flow-node .icon { font-size: 20px; display: block; }
        .flow-node .label { font-size: 9px; color: #888; text-transform: uppercase; }
        .flow-node .val { font-size: 14px; font-weight: 600; color: #00ff88; display: block; margin-top: 2px; }
        .flow-node.active { border-color: #00ff88; box-shadow: 0 0 20px rgba(0,255,136,0.15); background: #1a2a1a; }
        .flow-arrow { color: #2a2a5a; font-size: 20px; animation: pulse 1.5s infinite; }
        .flow-arrow.active { color: #00ff88; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .card {
            background: #111122;
            border: 1px solid #1a1a2e;
            border-radius: 10px;
            padding: 15px 20px;
        }
        .card-title { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 6px 8px; color: #666; border-bottom: 1px solid #1a1a2e; font-size: 10px; text-transform: uppercase; }
        td { padding: 6px 8px; border-bottom: 1px solid #151525; }
        .badge { padding: 1px 10px; border-radius: 12px; font-size: 10px; font-weight: 600; }
        .badge-red { background: #ff444422; color: #ff4444; }
        .badge-yellow { background: #ffcc0022; color: #ffcc00; }
        .badge-green { background: #00ff8822; color: #00ff88; }
        .badge-blue { background: #00ccff22; color: #00ccff; }
        .log-line { font-family: monospace; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #111122; display: flex; gap: 10px; }
        .log-line .time { color: #666; min-width: 60px; }
        @media (max-width: 1024px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="header">
    <h1>🛡️ BLACK VEIL</h1>
    <div>
        <span id="statusText" style="color:#00ff88;">● Operational</span>
        <span class="time" id="liveTime" style="margin-left:15px;">--:--:--</span>
    </div>
</div>

<div class="stats-grid">
    <div class="stat-card"><div class="value" id="events">0</div><div class="label">Events</div></div>
    <div class="stat-card"><div class="value" id="threats" style="color:#ff4444;">0</div><div class="label">Threats</div></div>
    <div class="stat-card"><div class="value" id="trust">0%</div><div class="label">Trust</div></div>
    <div class="stat-card"><div class="value" id="blocked">0</div><div class="label">Blocked</div></div>
    <div class="stat-card"><div class="value" id="creds">0</div><div class="label">Credentials</div></div>
    <div class="stat-card"><div class="value" id="response">0ms</div><div class="label">Response</div></div>
</div>

<div class="flow-container" id="flowContainer">
    <div class="flow-node active" id="node-incoming"><span class="icon">📡</span><span class="label">Incoming</span><span class="val" id="flowIncoming">0</span></div>
    <span class="flow-arrow active" id="arrow1">▶</span>
    <div class="flow-node" id="node-threat"><span class="icon">🔍</span><span class="label">Threat</span><span class="val" id="flowThreat">0</span></div>
    <span class="flow-arrow" id="arrow2">▶</span>
    <div class="flow-node" id="node-trust"><span class="icon">🔐</span><span class="label">Trust</span><span class="val" id="flowTrust">0%</span></div>
    <span class="flow-arrow" id="arrow3">▶</span>
    <div class="flow-node" id="node-cred"><span class="icon">🔑</span><span class="label">Credential</span><span class="val" id="flowCred">0</span></div>
    <span class="flow-arrow" id="arrow4">▶</span>
    <div class="flow-node" id="node-deception"><span class="icon">🎭</span><span class="label">Deception</span><span class="val" id="flowDeception">0</span></div>
    <span class="flow-arrow" id="arrow5">▶</span>
    <div class="flow-node" id="node-acdo"><span class="icon">🧠</span><span class="label">ACDO</span><span class="val" id="flowACDO">⏳</span></div>
    <span class="flow-arrow" id="arrow6">▶</span>
    <div class="flow-node" id="node-response"><span class="icon">⚡</span><span class="label">Response</span><span class="val" id="flowResponse">0</span></div>
</div>

<div class="grid-2">
    <div class="card">
        <div class="card-title">🚨 Recent Threats</div>
        <table><thead><tr><th>Time</th><th>Type</th><th>Source</th><th>Severity</th></tr></thead><tbody id="threatTable"><tr><td colspan="4" style="color:#666;text-align:center;">Loading...</td></tr></tbody></table>
    </div>
    <div class="card">
        <div class="card-title">📋 Activity Log</div>
        <div id="logContainer">Loading...</div>
    </div>
</div>

<script>
function updateTime() {
    document.getElementById('liveTime').textContent = new Date().toLocaleTimeString();
}
setInterval(updateTime, 1000);
updateTime();

function generateData() {
    const trust = Math.round(65 + Math.random() * 30);
    const threats = Math.floor(Math.random() * 6);
    const blocked = Math.floor(Math.random() * 8 + 3);
    const creds = Math.floor(Math.random() * 15 + 5);
    const events = Math.floor(Math.random() * 150 + 50);
    const response = Math.floor(Math.random() * 20 + 8);
    const incoming = Math.floor(Math.random() * 30 + 10);
    const threat = Math.floor(Math.random() * 20 + 5);
    const deception = Math.floor(Math.random() * 4 + 1);
    const acdo = ['⏳ Processing', '✅ Decided', '🔄 Routing', '⚡ Executing'][Math.floor(Math.random() * 4)];
    const resp = Math.floor(Math.random() * 15 + 3);
    return { trust, threats, blocked, creds, events, response, incoming, threat, deception, acdo, resp };
}

function updateDashboard() {
    const d = generateData();
    document.getElementById('events').textContent = d.events;
    document.getElementById('threats').textContent = d.threats;
    document.getElementById('trust').textContent = d.trust + '%';
    document.getElementById('blocked').textContent = d.blocked;
    document.getElementById('creds').textContent = d.creds;
    document.getElementById('response').textContent = d.response + 'ms';
    
    document.getElementById('flowIncoming').textContent = d.incoming;
    document.getElementById('flowThreat').textContent = d.threat;
    document.getElementById('flowTrust').textContent = d.trust + '%';
    document.getElementById('flowCred').textContent = d.creds;
    document.getElementById('flowDeception').textContent = d.deception;
    document.getElementById('flowACDO').textContent = d.acdo;
    document.getElementById('flowResponse').textContent = d.resp;

    const nodes = ['node-incoming', 'node-threat', 'node-trust', 'node-cred', 'node-deception', 'node-acdo', 'node-response'];
    const arrows = ['arrow1', 'arrow2', 'arrow3', 'arrow4', 'arrow5', 'arrow6'];
    nodes.forEach(n => document.getElementById(n).className = 'flow-node active');
    arrows.forEach(a => document.getElementById(a).className = 'flow-arrow active');

    const types = ['Port Scan', 'SQL Injection', 'Brute Force', 'Malware', 'Credential Theft', 'DDoS'];
    const sources = ['192.168.1.' + Math.floor(Math.random() * 255), '10.0.0.' + Math.floor(Math.random() * 255), '172.16.0.' + Math.floor(Math.random() * 255)];
    const sevs = ['Critical', 'High', 'Medium', 'Low'];
    let rows = '';
    for (let i = 0; i < Math.min(d.threats + 1, 5); i++) {
        const sev = sevs[Math.floor(Math.random() * sevs.length)];
        const cls = sev === 'Critical' ? 'badge-red' : sev === 'High' ? 'badge-yellow' : 'badge-blue';
        rows += `<tr><td style="color:#666;font-size:11px;">${i === 0 ? 'Now' : (i + 'm ago')}</td>
                 <td>${types[Math.floor(Math.random() * types.length)]}</td>
                 <td style="font-size:11px;">${sources[Math.floor(Math.random() * sources.length)]}</td>
                 <td><span class="badge ${cls}">${sev}</span></td></tr>`;
    }
    document.getElementById('threatTable').innerHTML = rows || '<tr><td colspan="4" style="color:#888;text-align:center;">✅ No threats</td></tr>';

    const logs = [
        `🛡️ Blocked attack from ${sources[0]}`,
        `🔐 Credential rotation completed`,
        `🎭 Deception deployed`,
        `📊 Trust score: ${d.trust}%`,
        `🔄 Key rotation completed`
    ];
    const now = new Date();
    document.getElementById('logContainer').innerHTML = logs.map((l, i) =>
        `<div class="log-line"><span class="time">${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes() - i * 2).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}</span><span>${l}</span></div>`
    ).join('');
}

updateDashboard();
setInterval(updateDashboard, 3000);
</script>
</body>
</html>
